# Baut DexHub bei jedem Push (Kompilieren + Tests) und veröffentlicht automatisch eine neue Version
# (v0.4.<Laufnummer>) mit fertigen Paketen. Der Update-Knopf im Programm findet sie dann von selbst.
#
# Außerdem: Wird auf GitHub von Hand eine Release veröffentlicht, werden die Pakete daran angehängt.
# Für eine schon bestehende Release: Actions -> Build -> "Run workflow" und den Tag-Namen eintragen.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag einer bestehenden Release, an die die Pakete angehängt werden (leer = nur bauen)'
        required: false
        default: ''

permissions:
  contents: write

env:
  # An welche Release die Pakete kommen (leer = keine, z. B. bei Pull Requests)
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || (github.event_name == 'push' && format('v0.4.{0}', github.run_number)) || '' }}

jobs:
  # Windows und Linux: schnell verfügbar
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Tests
        run: dotnet test tests/DexHub.Core.Tests -c Release

      - name: Emulator-Cores laden
        run: dotnet run scripts/FetchCores.cs

      - name: Programm bauen
        run: dotnet publish src/DexHub.App -c Release -r ${{ matrix.rid }} --self-contained true -o publish/DexHub -p:SourceRevisionId=${{ github.sha }}

      - name: SDL2 beilegen (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/libsdl-org/SDL/releases/download/release-2.30.9/SDL2-2.30.9-win32-x64.zip -OutFile sdl.zip
          Expand-Archive sdl.zip -DestinationPath sdl
          Copy-Item sdl/SDL2.dll publish/DexHub/

      - name: Packen (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path publish/DexHub -DestinationPath DexHub-${{ matrix.rid }}.zip

      - name: Packen (Linux)
        if: runner.os != 'Windows'
        run: cd publish && zip -r -y ../DexHub-${{ matrix.rid }}.zip DexHub

      - uses: actions/upload-artifact@v4
        with:
          name: DexHub-${{ matrix.rid }}
          path: DexHub-${{ matrix.rid }}.zip

  # Veröffentlicht die Version mit den Windows- und Linux-Paketen
  publish:
    needs: build
    # (Auf Job-Ebene gibt es den env-Kontext nicht, deshalb die Bedingung ausgeschrieben)
    if: github.event_name == 'push' || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ github.event_name == 'push' && format('DexHub {0}', env.RELEASE_TAG) || '' }}
          body: ${{ github.event_name == 'push' && github.event.head_commit.message || '' }}
          make_latest: true
          files: dist/*.zip

  # Mac: GitHub hat oft keine Mac-Rechner frei – deshalb erst nach der Veröffentlichung,
  # das Mac-Paket wird nachträglich angehängt
  mac:
    needs: [build, publish]
    if: always() && needs.build.result == 'success'
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Emulator-Cores laden
        run: dotnet run scripts/FetchCores.cs

      - name: Programm bauen
        run: dotnet publish src/DexHub.App -c Release -r osx-arm64 --self-contained true -o publish/DexHub -p:SourceRevisionId=${{ github.sha }}

      - name: SDL2 beilegen
        run: |
          brew install sdl2
          cp "$(brew --prefix sdl2)/lib/libSDL2-2.0.0.dylib" publish/DexHub/

      - name: Packen
        run: cd publish && zip -r -y ../DexHub-osx-arm64.zip DexHub

      - uses: actions/upload-artifact@v4
        with:
          name: DexHub-osx-arm64
          path: DexHub-osx-arm64.zip

      - name: An Release anhängen
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: DexHub-osx-arm64.zip

  # Android (APK für 64-Bit-ARM). Wird nach der Veröffentlichung angehängt, damit ein Fehler hier
  # die Windows-/Linux-Pakete nicht aufhält.
  android:
    needs: [build, publish]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android-Werkzeuge
        run: dotnet workload install android

      - name: Emulator-Cores laden (Android)
        run: dotnet run scripts/FetchCores.cs android

      # Signatur: Sind die Secrets ANDROID_KEYSTORE (Base64) und ANDROID_KEYSTORE_PASSWORD gesetzt, wird
      # immer mit demselben Schlüssel signiert – dann installieren sich Updates direkt über die alte Version.
      # Sonst nimmt der Build einen Test-Schlüssel (vor einem Update die alte App deinstallieren).
      - name: Signier-Schlüssel
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/dexhub.keystore"
            echo "SIGN_ARGS=-p:AndroidKeyStore=true -p:AndroidSigningKeyStore=$RUNNER_TEMP/dexhub.keystore -p:AndroidSigningKeyAlias=dexhub -p:AndroidSigningKeyPass=env:ANDROID_KEYSTORE_PASSWORD -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          fi

      - name: App bauen
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: >
          dotnet publish src/DexHub.Android -c Release -f net10.0-android -o publish/android
          -p:AndroidSdkDirectory=$ANDROID_HOME
          -p:SourceRevisionId=${{ github.sha }}
          -p:ApplicationVersion=${{ github.run_number }}
          $SIGN_ARGS

      - name: APK umbenennen
        run: |
          ls -la publish/android
          cp "$(ls publish/android/*-Signed.apk | head -1)" DexHub-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DexHub-android
          path: DexHub-android.apk

      - name: An Release anhängen
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: DexHub-android.apk
