# Baut DexHub bei jedem Push (Kompilieren + Tests) und erstellt fertige Downloads.
# Wird auf GitHub eine Release veröffentlicht (Tag-Name egal), werden die Pakete automatisch angehängt.
# Für eine schon bestehende Release: Actions -> Build -> "Run workflow" und den Tag-Namen eintragen.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag einer bestehenden Release, an die die Pakete angehängt werden (leer = nur bauen)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Tests
        run: dotnet test tests/DexHub.Core.Tests -c Release

      - name: Emulator-Cores laden
        run: dotnet run scripts/FetchCores.cs

      - name: Programm bauen
        run: dotnet publish src/DexHub.App -c Release -r ${{ matrix.rid }} --self-contained true -o publish/DexHub

      - name: SDL2 beilegen (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/libsdl-org/SDL/releases/download/release-2.30.9/SDL2-2.30.9-win32-x64.zip -OutFile sdl.zip
          Expand-Archive sdl.zip -DestinationPath sdl
          Copy-Item sdl/SDL2.dll publish/DexHub/

      - name: SDL2 beilegen (Mac)
        if: runner.os == 'macOS'
        run: |
          brew install sdl2
          cp "$(brew --prefix sdl2)/lib/libSDL2-2.0.0.dylib" publish/DexHub/

      - name: Packen (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path publish/DexHub -DestinationPath DexHub-${{ matrix.rid }}.zip

      - name: Packen (Linux/Mac)
        if: runner.os != 'Windows'
        run: cd publish && zip -r -y ../DexHub-${{ matrix.rid }}.zip DexHub

      - uses: actions/upload-artifact@v4
        with:
          name: DexHub-${{ matrix.rid }}
          path: DexHub-${{ matrix.rid }}.zip

  release:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag }}
          files: dist/*.zip
