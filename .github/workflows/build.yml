# Baut DexHub bei jedem Push (Kompilieren + Tests) und erstellt fertige Downloads.
# Mit einem Tag (z. B. "v0.1.0") werden die Pakete zusätzlich als GitHub-Release veröffentlicht.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Tests
        run: dotnet test tests/DexHub.Core.Tests -c Release

      - name: Emulator-Cores laden
        run: dotnet run scripts/FetchCores.cs

      - name: Programm bauen
        run: dotnet publish src/DexHub.App -c Release -r ${{ matrix.rid }} --self-contained true -o publish/DexHub

      - name: SDL2 beilegen (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/libsdl-org/SDL/releases/download/release-2.30.9/SDL2-2.30.9-win32-x64.zip -OutFile sdl.zip
          Expand-Archive sdl.zip -DestinationPath sdl
          Copy-Item sdl/SDL2.dll publish/DexHub/

      - name: SDL2 beilegen (Mac)
        if: runner.os == 'macOS'
        run: |
          brew install sdl2
          cp "$(brew --prefix sdl2)/lib/libSDL2-2.0.0.dylib" publish/DexHub/

      - name: Packen (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path publish/DexHub -DestinationPath DexHub-${{ matrix.rid }}.zip

      - name: Packen (Linux/Mac)
        if: runner.os != 'Windows'
        run: cd publish && zip -r -y ../DexHub-${{ matrix.rid }}.zip DexHub

      - uses: actions/upload-artifact@v4
        with:
          name: DexHub-${{ matrix.rid }}
          path: DexHub-${{ matrix.rid }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
